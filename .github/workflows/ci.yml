name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own `env` block is not reliably visible
    # to that same step's `if`, and a condition that silently never fires is a
    # gate that looks like protection and is not.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the scanner computes new-code metrics by diffing
          # against the base branch, and a depth-1 clone degrades every new_*
          # metric silently rather than failing.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run lint

      # biome does not typecheck and bun test strips types without checking them,
      # so without this the strict tsconfig is enforced nowhere
      - run: bun run typecheck

      # lcov alongside the console output: the console form is for a human
      # reading the log, the lcov is the only form SonarCloud can import.
      - run: bun test --coverage --coverage-reporter=lcov --coverage-reporter=text

      # `bun run build` joins this job in Task 8, when Astro is installed and
      # there is something to build. Listing it now would fail on every run and
      # train everyone to ignore a red check.

      - name: SonarQube Cloud scan
        # Inert until SONAR_TOKEN exists, so this can land before the project is
        # created in SonarCloud. See sonar-project.properties for the two things
        # that must be true in the UI first.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
