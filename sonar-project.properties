sonar.projectKey=zaebee_apex
sonar.organization=zaebee

# Product source and the two CI producers. scripts/ is included deliberately:
# Sonar counts every executable line under sonar.sources as a line to cover
# whether or not the coverage report mentions it, so leaving a directory out
# does not exempt it from the metric — it reports all of it as uncovered.
sonar.sources=src,scripts
sonar.tests=tests

# bun writes lcov natively: `bun test --coverage --coverage-reporter=lcov`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# docs/prototype/  — the design prototype used to settle the visual register.
#                    An artifact, not shipped source; it must not gate the repo.
# dist/, .astro/   — build output.
sonar.exclusions=docs/prototype/**,dist/**,.astro/**

# NOTE ON NEW-CODE PERIOD. This project carries no version number and is not
# release-managed, so `sonar.projectVersion` is deliberately absent. That means
# the new-code period must be set to "reference branch" (main) or "number of
# days" in the SonarCloud UI — NOT "previous version". With "previous version"
# and no version string, no VERSION event ever fires, the baseline can never
# move, and the window grows without bound until the gate is quietly a
# whole-project gate instead of a new-code one.
#
# NOTE ON ANALYSIS MODE. Committing this file signals SonarCloud to disable
# Automatic Analysis, which is intended: Automatic Analysis cannot import
# coverage at all, and coverage of the honesty invariants is the main thing
# worth measuring here. Add SONAR_TOKEN to repository secrets only after
# Automatic Analysis is off in the UI, or the two modes conflict.
